<!DOCTYPE html>
<html lang="it">
<head>
    <!-- Metadati e configurazione viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man Retro - Progetto Didattico</title>
    
    <!-- Dipendenze: Bootstrap per il layout e CSS personalizzato -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">

<div class="container-fluid py-4">
    <div class="row justify-content-center text-center">
        <div class="col-md-8">
            <!-- Intestazione e visualizzazione dinamica del punteggio -->
            <h1 class="display-4 text-warning mb-3">PAC-MAN</h1>
            <div class="d-flex justify-content-around mb-3">
                <h3>Punteggio: <span id="score">0</span></h3>
            </div>
            
            <!-- Contenitore principale del gioco dove verrà generata la griglia -->
            <div id="game-container" class="mx-auto border border-primary">
                <div id="grid"></div>
            </div>

            <!-- Area controlli e pulsante di avvio -->
            <div class="mt-4">
                <p class="text-muted">Utilizzi le frecce della tastiera per muoversi.</p>
                <button id="start-btn" class="btn btn-outline-warning btn-lg">Inizia Partita</button>
            </div>
        </div>
    </div>
</div>

<!-- Script: Caricamento di jQuery e della logica di gioco -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>
</body>
</html>
